<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mind Flash — Register</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #F5F5F5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }
        h1 { text-align: center; font-size: 26px; color: #1A1A2E; margin-bottom: 4px; }
        p  { text-align: center; color: #888; font-size: 14px; margin-bottom: 32px; }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #DDD;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #4A90E2; }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: #1A1A2E;
            color: white;
            margin-bottom: 12px;
        }
        .btn:hover { opacity: 0.9; }
        .link { text-align: center; margin-top: 16px; font-size: 14px; color: #888; }
        .link a { color: #4A90E2; text-decoration: none; }
        #error { color: #e53935; font-size: 13px; text-align: center; min-height: 20px; margin-bottom: 8px; }
    </style>
</head>
<body>
<div class="card">
    <h1>⚡ Create Account</h1>
    <p>Join Mind Flash and start learning!</p>

    <input type="text"     id="name"     placeholder="Full Name"/>
    <input type="email"    id="email"    placeholder="Email"/>
    <input type="password" id="password" placeholder="Password (min 6 chars)"/>
    <div id="error"></div>
    <button class="btn" id="btnRegister">Create Account</button>
    <div class="link">Already have an account? <a href="index.html">Login</a></div>
</div>

<script type="module">
    import { auth, db } from './firebase-config.js';
    import { createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const errEl = document.getElementById('error');

    document.getElementById('btnRegister').onclick = async () => {
        const name     = document.getElementById('name').value.trim();
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        errEl.textContent = '';

        if (!name || !email || !password) { errEl.textContent = 'Please fill all fields.'; return; }
        if (password.length < 6)           { errEl.textContent = 'Password must be at least 6 characters.'; return; }

        try {
            const result = await createUserWithEmailAndPassword(auth, email, password);
            const uid = result.user.uid;
            await setDoc(doc(db, 'users', uid), { name, email });
            location.href = 'home.html';
        } catch (e) { errEl.textContent = e.message; }
    };
</script>
</body>
</html>
