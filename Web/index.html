<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mind Flash — Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #F5F5F5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }
        .logo { font-size: 40px; text-align: center; margin-bottom: 8px; }
        h1 { text-align: center; font-size: 26px; color: #1A1A2E; margin-bottom: 4px; }
        p  { text-align: center; color: #888; font-size: 14px; margin-bottom: 32px; }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #DDD;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #4A90E2; }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background: #1A1A2E; color: white; }
        .btn-google  { background: white; color: #1A1A2E; border: 1.5px solid #DDD; }
        .divider {
            text-align: center;
            color: #AAA;
            font-size: 13px;
            margin: 8px 0 12px;
        }
        .link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
        .link a { color: #4A90E2; text-decoration: none; }
        #error { color: #e53935; font-size: 13px; text-align: center; min-height: 20px; margin-bottom: 8px; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">⚡</div>
    <h1>Mind Flash</h1>
    <p>A new fact every day. Never stop learning.</p>

    <input type="email"    id="email"    placeholder="Email"/>
    <input type="password" id="password" placeholder="Password"/>
    <div id="error"></div>
    <button class="btn btn-primary" id="btnLogin">Login</button>
    <div class="divider">or</div>
    <button class="btn btn-google" id="btnGoogle">🔵 Sign in with Google</button>
    <div class="link">No account? <a href="register.html">Register</a></div>
</div>

<script type="module">
    import { auth } from './firebase-config.js';
    import {
        signInWithEmailAndPassword,
        signInWithPopup,
        GoogleAuthProvider,
        onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    // Already logged in → go to home
    onAuthStateChanged(auth, user => {
        if (user) location.href = 'home.html';
    });

    const errEl = document.getElementById('error');

    document.getElementById('btnLogin').onclick = async () => {
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        errEl.textContent = '';
        if (!email || !password) { errEl.textContent = 'Enter email and password.'; return; }
        try {
            await signInWithEmailAndPassword(auth, email, password);
            location.href = 'home.html';
        } catch (e) { errEl.textContent = e.message; }
    };

    document.getElementById('btnGoogle').onclick = async () => {
        try {
            await signInWithPopup(auth, new GoogleAuthProvider());
            location.href = 'home.html';
        } catch (e) { errEl.textContent = e.message; }
    };
</script>
</body>
</html>
